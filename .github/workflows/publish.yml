name: Publish package to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # 既存の条件
    if: github.repository == 'TeamKOTOCA/mssgen' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # これが最重要：OIDC認証に必要です
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Bump package version
        id: version
        run: |
          npm version patch -m "chore: release v%s [skip ci]"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # --provenance をつけることで、GitHub Actionsから公開された証明が付きます
        # Trusted Publisher設定済みなら、自動で認証されます
        run: npm publish --access public --provenance

      - name: Push release commit and tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main --follow-tags